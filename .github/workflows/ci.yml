name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
        # macOS arm64 runners are capacity-constrained and fail to allocate
        # often enough to fail unrelated builds. macOS is still covered on 3.11.
        exclude:
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Validate POSIX launcher
        if: runner.os != 'Windows'
        run: sh -n run-local.sh
      - name: Validate PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $taskTokens = $null
          $taskErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'run-local.ps1'), [ref]$taskTokens, [ref]$taskErrors) | Out-Null
          if ($taskErrors.Count) { throw ($taskErrors | Out-String) }
      - name: Source release checks
        run: python scripts/check_release.py
      - name: Build source and wheel distributions
        run: python -m build --outdir .runtime/dist
      - name: Verify installed wheel and local startup
        run: python scripts/smoke_install.py --wheel-dir .runtime/dist
